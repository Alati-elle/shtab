name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - name: Mirror ChatGPT Sites build
        run: |
          set -euo pipefail
          mkdir -p _site/public/companions
          curl -fsSL https://shtab-pyatiklassnika.molodenskaya.chatgpt.site/ -o _site/index.html
          curl -fsSL https://shtab-pyatiklassnika.molodenskaya.chatgpt.site/public/companions/motya.svg -o _site/public/companions/motya.svg
          curl -fsSL https://shtab-pyatiklassnika.molodenskaya.chatgpt.site/public/companions/grey.svg -o _site/public/companions/grey.svg
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
