<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071327">
  <title>Штаб пятиклассника</title>
  <style>
    *{box-sizing:border-box}html{background:#050a15}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#effaff;background:radial-gradient(circle at 78% 5%,#2638aa 0,#101f61 20%,transparent 42%),radial-gradient(circle at 5% 85%,#9c2c7b55 0,transparent 35%),linear-gradient(145deg,#061224,#081735 55%,#130b2b);min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.app{position:relative;min-height:100vh;overflow:hidden}.app:before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(#53d8ff0c 1px,transparent 1px),linear-gradient(90deg,#53d8ff0c 1px,transparent 1px);background-size:35px 35px;mask-image:linear-gradient(black,transparent 82%)}
    .topbar{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 24px;position:relative;z-index:20;background:#071327b8;border-bottom:1px solid #2f61a4;backdrop-filter:blur(13px)}.logo,.profile{display:flex;align-items:center;gap:10px;font-weight:900}.logo{font-size:12px;letter-spacing:.08em}.logo-sign{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,#55e6ff,#6067ff);color:#07111e;box-shadow:0 0 26px #4ad8ff66}.profile{text-align:right;font-size:10px}.profile small{display:block;opacity:.62;font-size:8px;letter-spacing:.14em;text-transform:uppercase}.portrait{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#ff9b3d,#ff4f93);box-shadow:0 0 24px #ff5c8044;color:#171026}
    main{position:relative;z-index:3;max-width:1180px;margin:auto;padding:22px;display:grid;grid-template-columns:1.5fr .82fr;gap:16px}.hero,.panel,.mini,.control{border:1px solid #3b69ad;background:linear-gradient(145deg,#0d2647,#152252)}.hero{position:relative;overflow:hidden;min-height:330px;padding:26px;border-radius:24px;background:linear-gradient(135deg,#123773ed,#151a50e8 55%,#43155fcf);border-color:#6088d3;box-shadow:inset 0 0 60px #4a7ff122,0 16px 40px #02071466}.hero:after{content:"";position:absolute;width:230px;height:230px;border:1px solid #58deff55;border-radius:50%;right:-68px;top:-54px;box-shadow:0 0 0 22px #62dcff0a,0 0 0 47px #62dcff0a}.micro{font-size:9px;letter-spacing:.14em;text-transform:uppercase;font-weight:850}.hero h1{position:relative;z-index:2;margin:10px 0 8px;max-width:560px;font-size:38px;line-height:1.02;letter-spacing:0}.hero p{position:relative;z-index:2;margin:0;color:#b9d4ee;font-size:12px;line-height:1.55}.alert{position:relative;z-index:2;display:flex;align-items:center;gap:9px;width:max-content;max-width:100%;margin:18px 0;padding:9px 12px;border-radius:10px;background:#ff9b2e1d;border:1px solid #ffba58;color:#ffe2b6;font-size:10px;font-weight:800}.actions{position:relative;z-index:2;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.primary,.ghost,.icon-btn{border:0;border-radius:12px;min-height:43px;padding:0 16px;font-size:11px;font-weight:900;color:#071126;background:linear-gradient(135deg,#58edff,#4c8eff);box-shadow:0 10px 30px #4fd8ff55}.ghost{border:1px solid #4877ae;background:#102844;color:#d7eeff;box-shadow:none}.primary:disabled{opacity:.72;cursor:default}.xp{font-size:10px;color:#b8cde3}.xp b{color:#fff}.bar{width:min(320px,100%);height:8px;border-radius:999px;background:#18304a;overflow:hidden;margin-top:10px}.bar div{height:100%;background:linear-gradient(90deg,#20d6a4,#5ae5ff);transition:.3s}.agent{position:absolute;right:16px;bottom:-12px;width:180px;height:200px;z-index:1;filter:drop-shadow(0 15px 18px #08101d)}.head{position:absolute;width:72px;height:76px;border-radius:50% 50% 46% 46%;left:54px;top:18px;background:linear-gradient(135deg,#ffd09a,#d48862);border:3px solid #55defc}.hair{position:absolute;width:76px;height:40px;border-radius:44px 44px 12px 12px;left:52px;top:12px;background:#162544;transform:rotate(-4deg)}.body{position:absolute;width:145px;height:120px;border-radius:58px 58px 20px 20px;left:17px;top:90px;background:linear-gradient(135deg,#204f83,#4e3bab);border:2px solid #53dafa;clip-path:polygon(18% 0,82% 0,100% 100%,0 100%)}.badge{position:absolute;left:78px;top:119px;width:25px;height:25px;display:grid;place-items:center;border-radius:7px;background:#ffb13d;color:#18243a;font-size:10px;font-weight:900}
    .side{display:grid;gap:13px}.panel{padding:17px;border-radius:20px}.clock{position:relative;overflow:hidden}.clock strong{display:block;font-size:38px;line-height:1;margin:8px 0 4px;background:linear-gradient(90deg,#fff,#67e8ff);-webkit-background-clip:text;color:transparent}.clock span:last-child{font-size:10px;color:#9fb9d2}.orbit{position:absolute;right:16px;top:16px;width:54px;height:54px;border:1px dashed #ffc85f;border-radius:50%;animation:spin 9s linear infinite}.orbit:after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:#ffc454;right:1px;top:2px;box-shadow:0 0 18px #ffc14f}@keyframes spin{to{transform:rotate(360deg)}}.pack{background:#0b203bd9;border-color:#2e5b8b}.pack-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.pack-head b{font-size:11px}.pack-head span{color:#62e6ff;font-size:10px;font-weight:900}.pack-item{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:10px;color:#c4d5e8}.check{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:#102d4e;border:1px solid #3c6a91;color:#52e7ff}.check.done{background:#2bca9a;color:#061a1c;border-color:#5df1c0}.progress{height:7px;margin-top:11px;border-radius:10px;background:#18304a;overflow:hidden}.progress div{height:100%;background:linear-gradient(90deg,#20d6a4,#5ae5ff);transition:.3s}
    .tabs{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}.tab{border:1px solid #395f91;background:#0b1b32;color:#aecaeb;border-radius:12px;padding:10px 13px;font-size:10px;font-weight:900}.tab.active{color:#061224;background:#65e5ff;border-color:#9cf2ff}.route{grid-column:1/-1;display:grid;grid-template-columns:repeat(6,1fr);gap:9px;position:relative}.route:before{content:"";position:absolute;left:6%;right:6%;top:29px;height:3px;background:linear-gradient(90deg,#51e8ff 0 47%,#34486a 47%);z-index:0}.lesson{position:relative;z-index:1;padding:11px 8px 12px;text-align:center;border-radius:15px;background:#0c1a31;border:1px solid #324b70;font-size:9px;color:#9eb2ca;min-height:96px}.lesson i{display:grid;place-items:center;width:36px;height:36px;margin:0 auto 8px;border-radius:50%;background:#182c4c;color:#dbeaff;font-style:normal;font-size:15px;border:2px solid #3a5a83}.lesson.done i{background:#28d3ae;color:#08201d;border-color:#6af2d8}.lesson.now{border-color:#ffc35e;background:linear-gradient(#342440,#1b1b36)}.lesson.now i{background:#ffad3f;color:#321c07;border-color:#ffd388;box-shadow:0 0 18px #ffb33e77}.lesson b{display:block;color:#eaf4ff;font-size:10px;margin-bottom:3px}.extras{grid-column:1/-1;display:grid;grid-template-columns:1.2fr .8fr .8fr;gap:11px}.mini{min-height:82px;padding:14px;border-radius:16px;font-size:10px;color:#adc1d8}.mini b{display:block;margin-top:7px;color:#fff;font-size:12px}.workspace{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:14px}.control{border-radius:18px;padding:16px}.control h2{margin:0 0 12px;font-size:15px;letter-spacing:0}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:5px}.field label{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:#8fb6d8;font-weight:850}.field input,.field select{width:100%;border:1px solid #355d8f;border-radius:10px;background:#07192f;color:#eaf7ff;min-height:40px;padding:0 10px;font-size:12px}.subject-row{display:grid;grid-template-columns:1.1fr .8fr .7fr 1.2fr auto;gap:8px;margin-bottom:8px}.icon-btn{width:40px;padding:0;display:grid;place-items:center}.mission-list{display:grid;gap:8px}.mission{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid #304e79;border-radius:12px;background:#091a31;padding:10px;font-size:11px;color:#c9dcf1}.mission.done{border-color:#39d8b1;background:#0c2c34}.mission button{min-height:31px;border-radius:9px;padding:0 10px}.toast{position:fixed;z-index:100;left:50%;bottom:22px;transform:translate(-50%,14px);min-width:250px;max-width:80%;padding:12px 16px;border-radius:12px;background:#080b12;color:#fff;border:1px solid #49596e;box-shadow:0 15px 35px #0008;text-align:center;font-size:11px;font-weight:750;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
    .theme-aurora{background:radial-gradient(circle at 78% 5%,#2638aa 0,#101f61 20%,transparent 42%),radial-gradient(circle at 5% 85%,#9c2c7b55 0,transparent 35%),linear-gradient(145deg,#061224,#081735 55%,#130b2b)}.theme-matrix{background:radial-gradient(circle at 82% 12%,#0f8b7e 0,#0b4d54 22%,transparent 45%),radial-gradient(circle at 8% 82%,#c7a22744 0,transparent 36%),linear-gradient(145deg,#041818,#082632 55%,#161f24)}
    @media(max-width:860px){main{grid-template-columns:1fr}.workspace{grid-template-columns:1fr}.route{grid-template-columns:repeat(3,1fr)}.route:before{display:none}.extras{grid-template-columns:1fr}.subject-row{grid-template-columns:1fr 1fr}.subject-row .icon-btn{width:100%}}@media(max-width:520px){.topbar{padding:10px 14px}.profile-copy{display:none}main{padding:13px}.hero{min-height:370px;padding:20px}.hero h1{max-width:75%;font-size:27px}.hero p,.alert{max-width:72%}.actions{align-items:flex-start;flex-direction:column}.route{grid-template-columns:repeat(2,1fr)}.field-grid{grid-template-columns:1fr}.agent{opacity:.86;right:-28px}.clock strong{font-size:34px}}@media(prefers-reduced-motion:reduce){.orbit{animation:none}}
  </style>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="logo"><span class="logo-sign">H5</span>ШТАБ // ПЯТЫЙ УРОВЕНЬ</div>
      <div class="profile"><div class="profile-copy"><small id="agent-label">Агент</small><span id="top-status"></span></div><span class="portrait" id="portrait">MX</span></div>
    </header>
    <main>
      <section class="hero">
        <span class="micro" id="brief-date" style="color:#73eaff"></span>
        <h1 id="hero-title"></h1>
        <p id="brief-text"></p>
        <div class="alert" id="condition"></div>
        <div class="actions"><button class="primary" id="start-day" type="button">НАЧАТЬ ДЕНЬ</button><button class="ghost" id="evening-mode" type="button">ВЕЧЕРНИЙ РЕЖИМ</button><span class="xp"><b id="xp"></b> / <span id="xp-next"></span> XP</span></div>
        <div class="bar" aria-label="Опыт уровня"><div id="xp-progress"></div></div>
        <div class="agent" aria-hidden="true"><div class="head"></div><div class="hair"></div><div class="body"></div><div class="badge" id="agent-level">1</div></div>
      </section>
      <aside class="side">
        <div class="panel clock"><span class="micro" style="color:#71defc">До выхода</span><strong id="countdown">00:34</strong><span id="weather-line"></span><div class="orbit"></div></div>
        <div class="panel pack"><div class="pack-head"><b>УМНЫЙ РЮКЗАК</b><span id="pack-count"></span></div><div id="pack-list"></div><div class="progress"><div id="pack-progress"></div></div></div>
      </aside>
      <nav class="tabs" aria-label="Дни недели" id="tabs"></nav>
      <section class="route" aria-label="Маршрут учебного дня" id="route"></section>
      <section class="extras"><div class="mini">СЕРИЯ САМОСТОЯТЕЛЬНОСТИ<b id="streak-line"></b></div><div class="mini">ДОСТИЖЕНИЕ РЯДОМ<b id="achievement-line"></b></div><div class="mini">СЛЕДУЮЩАЯ ТОЧКА<b id="next-point"></b></div></section>
      <section class="workspace">
        <div class="control">
          <h2>Профиль агента</h2>
          <div class="field-grid">
            <div class="field"><label for="name">Имя</label><input id="name" maxlength="24"></div>
            <div class="field"><label for="nick">Ник</label><input id="nick" maxlength="14"></div>
            <div class="field"><label for="avatar">Позывной</label><input id="avatar" maxlength="3"></div>
            <div class="field"><label for="theme">Тема штаба</label><select id="theme"><option value="aurora">Неоновая орбита</option><option value="matrix">Зелёный сектор</option></select></div>
          </div>
        </div>
        <div class="control">
          <h2>Миссии дня</h2>
          <div class="mission-list" id="missions"></div>
        </div>
      </section>
      <section class="control" style="grid-column:1/-1">
        <h2>Редактор маршрута</h2>
        <div id="schedule-editor"></div>
        <button class="ghost" id="add-lesson" type="button">+ ДОБАВИТЬ УРОК</button>
      </section>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
  <script>
    const days=[
      {id:'tue',label:'ВТ',full:'вторник',date:'2026-09-01'},
      {id:'wed',label:'СР',full:'среда',date:'2026-09-02'},
      {id:'thu',label:'ЧТ',full:'четверг',date:'2026-09-03'},
      {id:'fri',label:'ПТ',full:'пятница',date:'2026-09-04'},
      {id:'mon',label:'ПН',full:'понедельник',date:'2026-09-07'}
    ];
    const months=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
    const subjects={
      'Математика':['Учебник математики','Тетрадь в клетку','Линейка'],
      'Русский':['Учебник русского','Рабочая тетрадь','Пенал'],
      'История':['Учебник истории','Тетрадь'],
      'Английский':['English book','Словарь','Тетрадь'],
      'Физкультура':['Спортивная форма','Кроссовки','Бутылка воды'],
      'Биология':['Учебник биологии','Атлас','Тетрадь'],
      'ИЗО':['Альбом','Карандаши','Ластик'],
      'Технология':['Папка проекта','Материалы','Фартук'],
      'Музыка':['Тетрадь по музыке'],
      'География':['Атлас','Контурная карта','Тетрадь']
    };
    const defaults={profile:{name:'Макс',nick:'MAX',avatar:'MX',theme:'aurora'},xp:740,started:{},streak:4,packed:{},packRewarded:{},missions:{},selectedDay:'tue',schedule:{mon:[['08:30','Математика','312'],['09:25','Русский','207'],['10:20','История','315'],['11:15','Английский','214'],['12:10','Физкультура','Зал'],['13:05','Биология','104']],tue:[['08:30','Русский','207'],['09:25','Математика','312'],['10:20','ИЗО','118'],['11:15','География','301']],wed:[['08:30','Английский','214'],['09:25','Биология','104'],['10:20','Математика','312'],['11:15','Технология','006']],thu:[['08:30','История','315'],['09:25','Русский','207'],['10:20','Музыка','122'],['11:15','Физкультура','Зал']],fri:[['08:30','Математика','312'],['09:25','География','301'],['10:20','Английский','214'],['11:15','Биология','104']]}};
    const state=load();
    const $=id=>document.getElementById(id);
    const toast=$('toast');
    function load(){try{return merge(structuredClone(defaults),JSON.parse(localStorage.getItem('hq-game-state')||'{}'))}catch{return structuredClone(defaults)}}
    function merge(base,next){for(const key in next){base[key]=next[key]&&typeof next[key]==='object'&&!Array.isArray(next[key])?merge(base[key]||{},next[key]):next[key]}return base}
    function save(){localStorage.setItem('hq-game-state',JSON.stringify(state))}
    function say(message){toast.textContent=message;toast.classList.add('show');clearTimeout(say.timer);say.timer=setTimeout(()=>toast.classList.remove('show'),2600)}
    function todayLessons(){return state.schedule[state.selectedDay]||[]}
    function selectedDayInfo(){return days.find(day=>day.id===state.selectedDay)||days[0]}
    function formatDate(iso){const date=new Date(iso+'T12:00:00Z');return date.getUTCDate()+' '+months[date.getUTCMonth()]}
    function dayStorageKey(){return selectedDayInfo().date}
    function gear(){return [...new Set(['Ключи','Пропуск','Телефон','Пенал',...todayLessons().flatMap(x=>subjects[x[1]]||['Тетрадь'])])]}
    function level(){return Math.floor(state.xp/1000)+1}
    function packedKey(){return dayStorageKey()}
    function missionKey(){return dayStorageKey()}
    function rewardKey(){return dayStorageKey()}
    function startedKey(){return dayStorageKey()}
    function award(amount,message){state.xp+=amount;save();render();say(message)}
    function render(){
      document.body.className='theme-'+state.profile.theme;$('agent-label').textContent='Агент '+state.profile.nick;$('top-status').textContent='Уровень '+level()+' · серия '+state.streak+' дня';$('portrait').textContent=state.profile.avatar||'MX';$('agent-level').textContent=level();$('xp').textContent=state.xp%1000;$('xp-next').textContent=1000;$('xp-progress').style.width=(state.xp%1000)/10+'%';
      const day=selectedDayInfo();$('brief-date').textContent='Брифинг · '+day.full+', '+formatDate(day.date)+' · учебная операция';$('hero-title').innerHTML='Штаб активирован.<br>Маршрут под контролем.';$('brief-text').innerHTML='Система обнаружила '+todayLessons().length+' уроков, '+gear().length+' предметов снаряжения<br>и '+missionList().filter(m=>!m.done).length+' активные миссии.';
      const sport=todayLessons().some(l=>l[1]==='Физкультура');$('condition').textContent=sport?'ОСОБОЕ УСЛОВИЕ: сегодня физкультура':'ОСОБОЕ УСЛОВИЕ: обычный режим, без тяжёлой экипировки';$('weather-line').textContent='+16° · дождь после 15:00';$('countdown').textContent='00:34';
      $('start-day').textContent=state.started[startedKey()]?'ДЕНЬ ЗАПУЩЕН':'НАЧАТЬ ДЕНЬ';$('start-day').disabled=!!state.started[startedKey()];$('streak-line').textContent=state.streak+' дня без забытых вещей';$('achievement-line').textContent=state.streak>=4?'«Рюкзак без потерь» · 4/5':'«Хозяин утра» · '+state.streak+'/3';$('next-point').textContent=nextPoint();
      renderInputs();renderTabs();renderPack();renderRoute();renderMissions();renderEditor();
    }
    function nextPoint(){const l=todayLessons()[Math.min(2,Math.max(0,todayLessons().length-1))];return l?l[1]+' · кабинет '+l[2]:'Маршрут свободен'}
    function renderInputs(){$('name').value=state.profile.name;$('nick').value=state.profile.nick;$('avatar').value=state.profile.avatar;$('theme').value=state.profile.theme}
    function renderTabs(){$('tabs').innerHTML=days.map(day=>'<button class="tab '+(day.id===state.selectedDay?'active':'')+'" data-day="'+day.id+'">'+day.label+' '+formatDate(day.date).replace(' сентября','.09')+'</button>').join('')}
    function renderPack(){const items=gear();const done=state.packed[packedKey()]||[];$('pack-count').textContent=done.length+' / '+items.length;$('pack-list').innerHTML=items.map(item=>'<div class="pack-item"><button class="check '+(done.includes(item)?'done':'')+'" type="button" data-pack="'+item+'" aria-label="'+item+'">'+(done.includes(item)?'✓':'')+'</button>'+item+'</div>').join('');$('pack-progress').style.width=(done.length/items.length*100)+'%'}
    function renderRoute(){$('route').innerHTML=todayLessons().map((l,i)=>'<div class="lesson '+(i<2?'done ':i===2?'now ':'')+'"><i>'+(i<2?'✓':i+1)+'</i><b>'+l[1]+'</b>'+l[0]+' · '+l[2]+'</div>').join('')}
    function missionList(){const key=missionKey();const base=[['pack','Собрать рюкзак на 100%',80],['route','Запомнить следующий кабинет',25],['homework','Записать одно важное задание',35]];return base.map(([id,title,xp])=>({id,title,xp,done:(state.missions[key]||[]).includes(id)}))}
    function renderMissions(){$('missions').innerHTML=missionList().map(m=>'<div class="mission '+(m.done?'done':'')+'"><span>'+m.title+' <b>+'+m.xp+' XP</b></span><button class="ghost" data-mission="'+m.id+'" '+(m.done?'disabled':'')+'>'+(m.done?'ГОТОВО':'ВЫПОЛНИТЬ')+'</button></div>').join('')}
    function renderEditor(){const options=Object.keys(subjects).map(s=>'<option>'+s+'</option>').join('');$('schedule-editor').innerHTML=todayLessons().map((l,i)=>'<div class="subject-row"><input data-edit="time" data-i="'+i+'" value="'+l[0]+'"><select data-edit="subject" data-i="'+i+'">'+options.replace('>'+l[1]+'<',' selected>'+l[1]+'<')+'</select><input data-edit="room" data-i="'+i+'" value="'+l[2]+'"><input data-edit="note" data-i="'+i+'" value="снаряжение авто" disabled><button class="icon-btn" data-remove="'+i+'" aria-label="Удалить урок">×</button></div>').join('')}
    document.addEventListener('click',e=>{const t=e.target;if(t.dataset.day){state.selectedDay=t.dataset.day;save();render()}if(t.dataset.pack){const key=packedKey();state.packed[key]=state.packed[key]||[];const list=state.packed[key];const i=list.indexOf(t.dataset.pack);i<0?list.push(t.dataset.pack):list.splice(i,1);if(list.length===gear().length&&!state.packRewarded[rewardKey()]){state.packRewarded[rewardKey()]=true;award(80,'Комплект снаряжения собран на 100%. +80 XP')}else{save();render()}}if(t.dataset.mission){const m=missionList().find(x=>x.id===t.dataset.mission);state.missions[missionKey()]=state.missions[missionKey()]||[];state.missions[missionKey()].push(m.id);award(m.xp,'Миссия выполнена: '+m.title+'. +'+m.xp+' XP')}if(t.dataset.remove){todayLessons().splice(Number(t.dataset.remove),1);state.packed[packedKey()]=[];state.packRewarded[rewardKey()]=false;save();render()}});
    document.addEventListener('input',e=>{const t=e.target;if(['name','nick','avatar','theme'].includes(t.id)){state.profile[t.id]=t.value;save();render()}});
    document.addEventListener('change',e=>{const t=e.target;if(t.dataset.edit){todayLessons()[Number(t.dataset.i)][{time:0,subject:1,room:2}[t.dataset.edit]]=t.value;state.packed[packedKey()]=[];state.packRewarded[rewardKey()]=false;save();render()}});
    $('start-day').addEventListener('click',()=>{state.started[startedKey()]=true;award(30,'День запущен. Следующая точка под контролем. +30 XP')});
    $('evening-mode').addEventListener('click',()=>say('Вечерний режим: рюкзак на завтра можно собрать заранее.'));
    $('add-lesson').addEventListener('click',()=>{todayLessons().push(['14:00','Математика','312']);state.packed[packedKey()]=[];state.packRewarded[rewardKey()]=false;save();render()});
    render();
  </script>
</body>
</html>
